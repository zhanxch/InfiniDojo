[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinidojo"
version = "0.1.0"
description = "Interaction-centric procedural generation for RoboDojo evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "jsonschema>=4.18", "PyYAML>=6"]

[project.optional-dependencies]
assets = ["bpy==4.2.0", "gin-config==0.5.0", "usd-core==25.5.1", "frozendict", "geomdl", "submitit", "shapely>=2", "OpenEXR"]
dev = ["pytest>=8", "ruff>=0.8", "Pillow>=11"]

[project.scripts]
infinidojo = "infinidojo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
